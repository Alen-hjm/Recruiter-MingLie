{% extends 'base.html' %}{% block content %}
<section class="hero"><p class="eyebrow">RECRUITER AGENT</p><h1>从 JD 到优先沟通名单</h1><p>创建岗位后，Agent 会编排 JD 解析、候选人接入、评分与排序。每一步均可追溯。</p></section>
<section class="grid"><form id="job-form" class="card"><h2>新建岗位</h2><label>岗位名称<input id="job-name" required placeholder="例如：高级 Python 后端工程师"></label><label>职位描述（JD）<textarea id="job-jd" rows="9" placeholder="粘贴完整 JD，包含技能、经验、城市等要求"></textarea></label><button>创建并进入工作台</button></form><article class="card"><h2>已有岗位</h2><div id="jobs"><p class="muted">正在加载…</p></div></article></section>
{% endblock %}
