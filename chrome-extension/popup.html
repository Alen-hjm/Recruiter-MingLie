<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 13px;
    }
    .header {
      background: linear-gradient(135deg, #16213e, #0f3460);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #533483, #0f3460);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .header .title { font-size: 15px; font-weight: 600; }
    .header .sub { font-size: 11px; color: #888; }

    .section { padding: 12px 16px; border-bottom: 1px solid #2a2a4a; }
    .section-title { font-size: 12px; color: #888; margin-bottom: 8px; }

    .config-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .config-row label { min-width: 60px; font-size: 12px; color: #aaa; }
    .config-row input, .config-row select {
      flex: 1; padding: 5px 8px;
      background: #16213e; border: 1px solid #2a2a4a;
      border-radius: 4px; color: #e0e0e0; font-size: 12px;
    }
    .config-row input:focus, .config-row select:focus {
      outline: none; border-color: #533483;
    }

    .btn {
      padding: 8px 16px;
      border: none; border-radius: 6px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #533483, #0f3460);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-stop { background: #cc6666; color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    .status-bar {
      display: flex; gap: 12px; padding: 10px 16px;
      background: #16213e; border-bottom: 1px solid #2a2a4a;
    }
    .status-item { text-align: center; flex: 1; }
    .status-num { font-size: 20px; font-weight: 700; color: #00d7ff; }
    .status-label { font-size: 10px; color: #888; margin-top: 2px; }

    .log {
      max-height: 180px; overflow-y: auto;
      padding: 8px 16px; font-size: 11px;
      font-family: "Cascadia Code", "Consolas", monospace;
    }
    .log-entry { padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
    .log-ok { color: #b5bd68; }
    .log-err { color: #cc6666; }
    .log-info { color: #81a2be; }
    .log-dim { color: #666; }

    .actions { padding: 12px 16px; display: flex; gap: 8px; }

    .server-status {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .server-online { background: #b5bd68; }
    .server-offline { background: #cc6666; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">猎</div>
    <div>
      <div class="title">明猎 - 简历抓取</div>
      <div class="sub">
        <span class="server-status" id="serverDot"></span>
        <span id="serverStatus">检测中...</span>
      </div>
    </div>
  </div>

  <!-- 配置 -->
  <div class="section">
    <div class="section-title">🔑 API Key（在网页端设置页获取）</div>
    <div class="config-row">
      <label>Key</label>
      <input type="password" id="apiKeyInput" placeholder="输入你的 LLM API Key">
      <button class="btn btn-sm btn-primary" id="btnSaveKey">保存</button>
    </div>
    <div class="section-title">📋 抓取配置</div>
    <div class="config-row">
      <label>岗位</label>
      <select id="jobSelect">
        <option value="">加载中...</option>
      </select>
    </div>
    <div class="config-row">
      <label>页数</label>
      <input type="number" id="maxPages" value="3" min="1" max="10">
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="status-item">
      <div class="status-num" id="statCards">0</div>
      <div class="status-label">页面卡片</div>
    </div>
    <div class="status-item">
      <div class="status-num" id="statScraped">0</div>
      <div class="status-label">已抓取</div>
    </div>
    <div class="status-item">
      <div class="status-num" id="statFiltered">0</div>
      <div class="status-label">已过滤</div>
    </div>
    <div class="status-item">
      <div class="status-num" id="statPage">0/0</div>
      <div class="status-label">页数</div>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="actions">
    <button class="btn btn-primary" id="btnStart" style="flex:1">▶ 开始抓取</button>
    <button class="btn btn-stop" id="btnStop" style="display:none">⏹ 停止</button>
    <button class="btn btn-primary btn-sm" id="btnSend">📤 发送评分</button>
  </div>

  <!-- 日志 -->
  <div class="section" style="padding-bottom:4px">
    <div class="section-title">📝 运行日志</div>
  </div>
  <div class="log" id="logArea"></div>

  <script src="popup.js"></script>
</body>
</html>
