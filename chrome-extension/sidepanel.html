<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明猎 AI 招聘助手</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif; background:#fff; color:#333; font-size:13px; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

/* ── 顶部 ── */
.header { padding:12px 16px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.header-left { display:flex; align-items:center; gap:8px; }
.header .logo { width:28px; height:28px; border-radius:6px; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; }
.header .title { font-size:14px; font-weight:600; }
.header-right { display:flex; gap:6px; }
.header-right .icon-btn { width:28px; height:28px; border-radius:6px; border:1px solid #e8e8e8; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
.header-right .icon-btn:hover { background:#f5f5f5; }

/* ── 菜单标签 ── */
.tabs { display:flex; border-bottom:1px solid #f0f0f0; flex-shrink:0; overflow-x:auto; }
.tab { padding:8px 14px; font-size:12px; color:#888; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:all 0.15s; }
.tab:hover { color:#555; }
.tab.active { color:#4a6cf7; border-bottom-color:#4a6cf7; font-weight:600; }

/* ── 面板容器 ── */
.panels { flex:1; overflow:hidden; position:relative; }
.panel { position:absolute; top:0; left:0; right:0; bottom:0; display:none; flex-direction:column; }
.panel.active { display:flex; }

/* ── AI 对话面板 ── */
.chat-messages { flex:1; overflow-y:auto; padding:12px 16px; }
.msg { margin-bottom:12px; display:flex; gap:8px; }
.msg-user { flex-direction:row-reverse; }
.msg-avatar { width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; }
.msg-user .msg-avatar { background:#4a6cf7; color:#fff; }
.msg-ai .msg-avatar { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
.msg-bubble { max-width:85%; padding:8px 12px; border-radius:12px; font-size:12px; line-height:1.6; word-break:break-word; }
.msg-user .msg-bubble { background:#4a6cf7; color:#fff; border-bottom-right-radius:4px; }
.msg-ai .msg-bubble { background:#f5f5f5; color:#333; border-bottom-left-radius:4px; }
.msg-bubble p { margin-bottom:6px; }
.msg-bubble p:last-child { margin-bottom:0; }
.msg-bubble code { background:#e8e8e8; padding:1px 4px; border-radius:3px; font-size:11px; }
.msg-bubble strong { color:#4a6cf7; }
.msg-time { font-size:10px; color:#bbb; margin-top:4px; }
.msg-user .msg-time { text-align:right; }

/* 快捷操作 */
.quick-actions { display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px; border-top:1px solid #f8f8f8; flex-shrink:0; }
.quick-btn { padding:4px 10px; border-radius:14px; border:1px solid #e8e8e8; background:#fff; font-size:11px; color:#666; cursor:pointer; transition:all 0.15s; }
.quick-btn:hover { border-color:#4a6cf7; color:#4a6cf7; }

/* 输入区 */
.chat-input-area { padding:10px 16px; border-top:1px solid #f0f0f0; flex-shrink:0; }
.chat-input-row { display:flex; gap:8px; align-items:flex-end; }
.chat-input { flex:1; padding:8px 12px; border:1px solid #e8e8e8; border-radius:18px; font-size:12px; outline:none; resize:none; min-height:36px; max-height:100px; font-family:inherit; }
.chat-input:focus { border-color:#4a6cf7; }
.send-btn { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.send-btn:disabled { opacity:0.4; }
.send-btn svg { width:14px; height:14px; fill:#fff; }
.chat-hint { font-size:10px; color:#bbb; text-align:center; margin-top:4px; }

/* ── 功能面板通用样式 ── */
.panel-body { flex:1; overflow-y:auto; padding:12px 16px; }
.panel-title { font-size:14px; font-weight:600; margin-bottom:12px; }

/* 状态指示 */
.status-bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.status-chip { display:flex; align-items:center; gap:4px; padding:3px 8px; border-radius:12px; font-size:11px; background:#f5f5f5; }
.dot { width:6px; height:6px; border-radius:50%; }
.dot-green { background:#52c41a; }
.dot-blue { background:#1890ff; }
.dot-orange { background:#faad14; }
.dot-gray { background:#d9d9d9; }

/* 配置行 */
.config-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.config-row label { min-width:45px; font-size:12px; color:#888; }
.config-row input,.config-row select { flex:1; padding:6px 10px; border:1px solid #e8e8e8; border-radius:6px; font-size:12px; outline:none; }
.config-row input:focus,.config-row select:focus { border-color:#4a6cf7; }

/* 按钮 */
.btn { padding:8px 16px; border:none; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.15s; }
.btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
.btn-primary:hover { opacity:0.9; }
.btn-primary:disabled { opacity:0.4; cursor:not-allowed; }
.btn-default { background:#f5f5f5; color:#555; }
.btn-default:hover { background:#e8e8e8; }
.btn-sm { padding:4px 10px; font-size:11px; }
.btn-block { width:100%; }
.btn-group { display:flex; gap:8px; margin-top:12px; }

/* 简历卡片 */
.resume-card { border:1px solid #f0f0f0; border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; transition:all 0.15s; }
.resume-card:hover { border-color:#4a6cf7; box-shadow:0 2px 8px rgba(74,108,247,0.1); }
.resume-card .name { font-weight:600; font-size:13px; }
.resume-card .meta { font-size:11px; color:#888; margin-top:3px; }
.resume-card .tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
.resume-card .tag { font-size:10px; padding:2px 6px; border-radius:4px; background:#f0f4ff; color:#4a6cf7; }
.resume-card .score { float:right; font-size:14px; font-weight:700; }
.score-high { color:#52c41a; }
.score-mid { color:#faad14; }
.score-low { color:#ff4d4f; }

/* 管道 */
.pipeline-bar { display:flex; gap:3px; margin-bottom:12px; flex-wrap:wrap; }
.pipeline-chip { padding:4px 8px; border-radius:12px; font-size:10px; cursor:pointer; }

/* 日志 */
.log-entry { padding:3px 0; font-size:11px; border-bottom:1px solid #fafafa; font-family:"Cascadia Code","Consolas",monospace; }
.log-ok { color:#52c41a; }
.log-err { color:#ff4d4f; }
.log-info { color:#1890ff; }
.log-dim { color:#bbb; }

/* 空状态 */
.empty { text-align:center; padding:30px 16px; color:#bbb; font-size:12px; }

/* 加载 */
.loading { display:inline-block; width:14px; height:14px; border:2px solid #e8e8e8; border-top-color:#4a6cf7; border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* 欢迎 */
.welcome { text-align:center; padding:30px 16px; }
.welcome h2 { font-size:18px; margin-bottom:4px; }
.welcome h2 span { background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.welcome p { color:#888; font-size:12px; margin-bottom:16px; }
.welcome-cards { display:flex; flex-direction:column; gap:8px; text-align:left; }
.welcome-card { padding:10px 12px; border:1px solid #f0f0f0; border-radius:8px; cursor:pointer; transition:all 0.15s; }
.welcome-card:hover { border-color:#4a6cf7; background:#f8f9ff; }
.welcome-card .wc-title { font-weight:600; font-size:12px; margin-bottom:2px; }
.welcome-card .wc-desc { font-size:11px; color:#888; }
</style>
</head>
<body>

<!-- 顶部 -->
<div class="header">
  <div class="header-left">
    <div class="logo">猎</div>
    <div class="title">明猎 AI 助手</div>
  </div>
  <div class="header-right">
    <div class="icon-btn" id="btnRefresh" title="刷新">🔄</div>
    <div class="icon-btn" id="btnClearChat" title="清空对话">🗑️</div>
  </div>
</div>

<!-- 菜单标签 -->
<div class="tabs">
  <div class="tab active" data-panel="chat">💬 AI 助手</div>
  <div class="tab" data-panel="scrape">🔍 抓取</div>
  <div class="tab" data-panel="resumes">👥 候选人</div>
  <div class="tab" data-panel="pipeline">📊 管道</div>
  <div class="tab" data-panel="settings">⚙️</div>
</div>

<!-- 面板 -->
<div class="panels">

  <!-- AI 对话面板 -->
  <div class="panel active" id="panel-chat">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome">
        <h2>👋 <span>Hi, 你好</span></h2>
        <p>我是明猎 AI 招聘助手，有什么可以帮你的？</p>
        <div class="welcome-cards">
          <div class="welcome-card" data-msg="帮我分析一下当前岗位的简历情况">
            <div class="wc-title">📋 简历分析</div>
            <div class="wc-desc">分析当前岗位的简历匹配情况</div>
          </div>
          <div class="welcome-card" data-msg="推荐几个适合这个岗位的候选人">
            <div class="wc-title">🏆 推荐候选人</div>
            <div class="wc-desc">从简历库中推荐最匹配的人选</div>
          </div>
          <div class="welcome-card" data-msg="这个岗位的市场薪资水平是多少">
            <div class="wc-title">💰 薪资查询</div>
            <div class="wc-desc">查询岗位市场薪资行情</div>
          </div>
          <div class="welcome-card" data-msg="帮我写一份招聘JD">
            <div class="wc-title">✍️ 生成 JD</div>
            <div class="wc-desc">根据需求生成岗位描述</div>
          </div>
        </div>
      </div>
    </div>
    <div class="quick-actions" id="quickActions">
      <div class="quick-btn" data-msg="查看知识库统计">📚 知识库</div>
      <div class="quick-btn" data-msg="查看岗位列表">📋 岗位</div>
      <div class="quick-btn" data-msg="查看候选人管道">📊 管道</div>
      <div class="quick-btn" data-msg="推荐理由">💡 推荐理由</div>
      <div class="quick-btn" data-msg="人才风险点">⚠️ 风险点</div>
    </div>
    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput" placeholder="输入问题，如：推荐理由、人才风险点、薪资行情..." rows="1"></textarea>
        <button class="send-btn" id="btnSend"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
      </div>
      <div class="chat-hint">内容由 AI 生成，请仔细甄别</div>
    </div>
  </div>

  <!-- 抓取面板 -->
  <div class="panel" id="panel-scrape">
    <div class="panel-body">
      <div class="panel-title">简历抓取</div>
      <div class="status-bar">
        <div class="status-chip"><div class="dot dot-gray" id="dotServer"></div><span id="txtServer">未连接</span></div>
        <div class="status-chip"><div class="dot dot-gray" id="dotPage"></div><span id="txtPage">未检测到猎聘</span></div>
      </div>
      <div class="config-row">
        <label>岗位</label>
        <select id="selJob"><option value="">加载中...</option></select>
      </div>
      <div class="config-row">
        <label>页数</label>
        <input type="number" id="inputPages" value="3" min="1" max="10">
      </div>
      <div class="config-row">
        <label>模式</label>
        <select id="selDetailMode">
          <option value="card">仅卡片信息</option>
          <option value="detail">进详情页抓取（完整）</option>
        </select>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary btn-block" id="btnScrape">▶ 开始抓取</button>
      </div>
      <div id="scrapeStats" style="margin-top:12px;display:none">
        <div class="status-bar">
          <div class="status-chip">📄 <strong id="statCards">0</strong> 卡片</div>
          <div class="status-chip">✅ <strong id="statScraped">0</strong> 已抓</div>
          <div class="status-chip">🔍 <strong id="statFiltered">0</strong> 过滤</div>
          <div class="status-chip">📑 <strong id="statPage">0/0</strong></div>
        </div>
      </div>
      <div id="scrapeLog" style="max-height:200px;overflow-y:auto;margin-top:8px"></div>
    </div>
  </div>

  <!-- 候选人面板 -->
  <div class="panel" id="panel-resumes">
    <div class="panel-body">
      <div class="panel-title">候选人列表</div>
      <div class="config-row">
        <label>岗位</label>
        <select id="selJobResume"><option value="">请选择岗位</option></select>
      </div>
      <div id="resumeList"><div class="empty">选择岗位后加载候选人</div></div>
    </div>
  </div>

  <!-- 管道面板 -->
  <div class="panel" id="panel-pipeline">
    <div class="panel-body">
      <div class="panel-title">管道管理</div>
      <div class="config-row">
        <label>岗位</label>
        <select id="selJobPipe"><option value="">请选择岗位</option></select>
      </div>
      <div id="pipelineContent"><div class="empty">选择岗位查看管道</div></div>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="panel" id="panel-settings">
    <div class="panel-body">
      <div class="panel-title">设置</div>
      <div class="config-row">
        <label>Key</label>
        <input type="password" id="inputApiKey" placeholder="LLM API Key">
      </div>
      <div class="config-row">
        <label>服务器</label>
        <input type="text" id="inputServer" value="http://127.0.0.1:5000">
      </div>
      <div class="btn-group">
        <button class="btn btn-primary btn-block" id="btnSaveSettings">保存</button>
      </div>
      <div id="settingsMsg" style="margin-top:8px;font-size:12px"></div>
      <div style="margin-top:20px;padding-top:12px;border-top:1px solid #f0f0f0">
        <div class="panel-title" style="font-size:12px">📚 知识库</div>
        <div id="knowledgeStats" style="font-size:11px;color:#888">加载中...</div>
        <button class="btn btn-default btn-sm" id="btnRefreshKnowledge" style="margin-top:8px">🔄 刷新知识库</button>
      </div>
    </div>
  </div>

</div>

<script src="sidepanel.js"></script>
</body>
</html>
