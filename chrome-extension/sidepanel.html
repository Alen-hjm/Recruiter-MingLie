<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明猎 AI 招聘助手</title>
<style>
/* ════════════════ 基础 ════════════════ */
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#edf0f5; color:#25324a; font-size:13px; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.thin-scroll { scrollbar-width:none; }
.thin-scroll::-webkit-scrollbar { display:none; }

/* ════════════════ 顶部深色栏 ════════════════ */
.ml-header { height:58px; flex-shrink:0; padding:0 20px; display:flex; align-items:center; justify-content:space-between; background:#343434; color:#fff; }
.ml-header .left { display:flex; align-items:center; gap:12px; }
.ml-header .logo { width:28px; height:28px; border-radius:50%; background:#4d6be6; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; }
.ml-header .title { font-size:15px; font-weight:500; letter-spacing:.5px; }
.ml-header .right { display:flex; align-items:center; gap:16px; color:#c9c9c9; }
.ml-header .right button { background:none; border:none; color:inherit; cursor:pointer; display:flex; }
.ml-header .right button:hover { color:#fff; }
.ml-header .right svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; }

/* ════════════════ 职位信息区 ════════════════ */
.job-section { padding:16px 20px; border-bottom:1px solid #edf0f5; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; background:#fff; }
.job-section .left { display:flex; align-items:center; gap:12px; }
.job-section .logo { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#6675e8,#7352c7); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; }
.job-section .name { font-size:16px; font-weight:600; color:#202b43; }
.job-section .sub { font-size:11px; color:#929bae; margin-top:2px; display:flex; align-items:center; gap:2px; }
#selJobGlobal { appearance:none; -webkit-appearance:none; border:none; background:transparent; font-size:11px; color:#4f6bed; font-weight:500; padding-right:12px; cursor:pointer; outline:none; }
.job-select-wrap { position:relative; display:inline-block; }
.job-select-wrap::after { content:""; position:absolute; right:0; top:50%; transform:translateY(-50%); border-left:3.5px solid transparent; border-right:3.5px solid transparent; border-top:4px solid #929bae; pointer-events:none; }
.job-section .clear-btn { width:32px; height:32px; border-radius:8px; border:1px solid #e0e5ef; background:#fff; color:#7b879c; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.job-section .clear-btn:hover { background:#f5f7fb; }
.job-section .clear-btn svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; }

/* ════════════════ 标签栏 ════════════════ */
.nav { height:45px; flex-shrink:0; display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid #e6e9f0; background:#fff; }
.tab { font-size:13px; color:#69758c; background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:all .15s; }
.tab:hover { color:#326dff; }
.tab.active { color:#326dff; border-bottom-color:#326dff; background:#f7f9ff; font-weight:500; }
.tab svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; }

/* ════════════════ 内容滚动区 ════════════════ */
.content { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:20px; background:#fff; }
.panel { display:none; }
.panel.active { display:block; }

/* 欢迎 */
.welcome { text-align:center; margin-bottom:20px; }
.welcome .emoji { font-size:28px; margin-bottom:4px; }
.welcome h2 { font-size:21px; font-weight:600; color:#6658cb; }
.welcome p { font-size:13px; color:#8a93a5; margin-top:4px; }

/* 当前职位概览 */
.overview { margin-bottom:20px; }
.sec-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.sec-title { font-size:14px; font-weight:600; color:#27334a; }
.sec-tag { font-size:11px; color:#7e8ba3; }
.overview-card { border:1px solid #e6eaf2; background:#fafbfe; border-radius:12px; padding:16px; }
.overview-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.overview-job { font-size:13px; font-weight:500; color:#25324a; }
.overview-status { padding:2px 8px; border-radius:6px; background:#eaf2ff; color:#3979e8; font-size:11px; }
.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); text-align:center; }
.stats-grid > div { padding:0 4px; }
.stats-grid > div:not(:last-child) { border-right:1px solid #e5e8ef; }
.stat-num { font-size:20px; font-weight:600; line-height:1; }
.stat-num.rec { color:#2f6df6; }
.stat-num.int { color:#f08a43; }
.stat-num.rej { color:#53a77b; }
.stat-label { font-size:11px; color:#8b95a7; margin-top:4px; }

/* 我可以帮你 */
.help { margin-bottom:12px; }
.help-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.quick-card { text-align:left; border:1px solid #e8ebf1; border-radius:12px; padding:14px; background:#fff; cursor:pointer; transition:all .18s ease; display:block; }
.quick-card:hover { border-color:#9bb7ff; box-shadow:0 5px 16px rgba(55,104,220,.10); transform:translateY(-1px); }
.quick-card .qc-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.quick-card .qc-icon { width:28px; height:28px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.quick-card .qc-icon svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; }
.quick-card .qc-title { font-size:13px; font-weight:600; color:#25324a; }
.quick-card .qc-desc { font-size:11px; line-height:20px; color:#8c96a8; }
.qc-icon.pink { background:#fff1ed; color:#ef7858; }
.qc-icon.blue { background:#eef1ff; color:#5e6edb; }
.qc-icon.yellow { background:#fff6e5; color:#e69a35; }
.qc-icon.green { background:#edf9f3; color:#4aaf7b; }

/* feedback 提示 */
.feedback { display:none; margin-top:16px; border-radius:8px; background:#f1f6ff; color:#3d6fce; font-size:12px; padding:8px 12px; }
.feedback.show { display:block; animation:bubbleIn .2s ease-out; }
@keyframes bubbleIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

/* ════════════════ 底部 ════════════════ */
.footer { flex-shrink:0; border-top:1px solid #e7eaf0; background:#fff; padding:12px 20px 16px; }
.chips { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; }
.chip { white-space:nowrap; display:flex; align-items:center; gap:4px; padding:6px 12px; border-radius:20px; border:1px solid #e2e7ef; background:#fff; color:#68758b; font-size:12px; cursor:pointer; transition:all .18s ease; }
.chip:hover { border-color:#9bb7ff; color:#326dff; background:#f4f7ff; }
.chip svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8; }
.input-row { display:flex; align-items:center; gap:8px; border:1px solid #e3e7ee; background:#fff; border-radius:24px; padding:4px 6px 4px 16px; box-shadow:0 2px 8px rgba(31,51,93,.04); }
.input-row:focus-within { border-color:#7c8ce9; }
#chatInput { flex:1; min-width:0; outline:none; border:none; background:transparent; font-size:12px; color:#36435b; font-family:inherit; resize:none; line-height:1.4; padding:6px 0; }
#chatInput::placeholder { color:#a6afbd; }
.send-btn { width:36px; height:36px; border-radius:50%; background:#6872d9; border:none; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s; }
.send-btn:hover { background:#5360ca; }
.send-btn:disabled { opacity:.45; }
.send-btn svg { width:17px; height:17px; stroke:#fff; fill:none; stroke-width:1.8; }
.footer-hint { text-align:center; font-size:10px; color:#aab1bd; margin-top:8px; }

/* ════════════════ 聊天消息 ════════════════ */
.msg { display:flex; gap:8px; margin-bottom:12px; align-items:flex-start; }
.msg-user { flex-direction:row-reverse; }
.msg-avatar { width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; }
.msg-user .msg-avatar { background:#6872d9; color:#fff; }
.msg-ai .msg-avatar { background:linear-gradient(135deg,#6675e8,#7352c7); color:#fff; }
.msg-bubble { max-width:85%; padding:8px 12px; border-radius:12px; font-size:12px; line-height:1.6; word-break:break-word; }
.msg-user .msg-bubble { background:#6872d9; color:#fff; border-bottom-right-radius:4px; }
.msg-ai .msg-bubble { background:#f1f5f9; color:#25324a; border-bottom-left-radius:4px; }
.msg-bubble p { margin-bottom:6px; }
.msg-bubble p:last-child { margin-bottom:0; }
.msg-bubble code { background:rgba(0,0,0,.06); padding:1px 4px; border-radius:3px; font-size:11px; }
.msg-bubble strong { color:#6658cb; }
.msg-time { font-size:10px; color:#a6afbd; margin-top:4px; }
.msg-user .msg-time { text-align:right; }

/* ════════════════ 功能面板通用 ════════════════ */
.panel-title { font-size:15px; font-weight:600; margin-bottom:12px; color:#27334a; }
.status-bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.status-chip { display:flex; align-items:center; gap:5px; padding:4px 10px; border-radius:12px; font-size:11px; background:#f1f5f9; color:#5a667c; }
.dot { width:7px; height:7px; border-radius:50%; }
.dot-green { background:#00b96b; } .dot-blue { background:#2f6df6; } .dot-orange { background:#faad14; } .dot-gray { background:#cbd5e1; }
.config-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.config-row label { min-width:45px; font-size:12px; color:#929bae; }
.config-row input,.config-row select { flex:1; padding:8px 10px; border:1px solid #e3e7ee; border-radius:8px; font-size:12px; outline:none; color:#36435b; font-family:inherit; }
.config-row input:focus,.config-row select:focus { border-color:#7c8ce9; }
.btn { padding:9px 16px; border:none; border-radius:8px; font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; }
.btn-primary { background:#6872d9; color:#fff; }
.btn-primary:hover { background:#5360ca; }
.btn-primary:disabled { opacity:.45; cursor:not-allowed; }
.btn-default { background:#f1f5f9; color:#5a667c; }
.btn-default:hover { background:#e2e8f0; }
.btn-sm { padding:5px 11px; font-size:11px; }
.btn-block { width:100%; }
.btn-group { display:flex; gap:8px; margin-top:12px; }
.resume-card { border:1px solid #e8ebf1; border-radius:10px; padding:11px 12px; margin-bottom:8px; cursor:pointer; background:#fff; transition:all .15s; }
.resume-card:hover { border-color:#9bb7ff; box-shadow:0 2px 8px rgba(55,104,220,.06); }
.resume-card .name { font-weight:600; font-size:13px; color:#202b43; }
.resume-card .meta { font-size:11px; color:#929bae; margin-top:3px; }
.resume-card .tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }
.resume-card .tag { font-size:10px; padding:2px 7px; border-radius:5px; background:#eef1ff; color:#5e6edb; }
.resume-card .score { float:right; font-size:15px; font-weight:700; }
.score-high { color:#00b96b; } .score-mid { color:#faad14; } .score-low { color:#f5222d; }
.resume-card .actions { display:flex; gap:6px; margin-top:8px; }
.resume-card .actions .mini { flex:1; text-align:center; padding:5px 0; border-radius:7px; font-size:11px; cursor:pointer; border:1px solid #e8ebf1; background:#fff; color:#68758b; }
.resume-card .actions .mini.primary { background:#eef1ff; border-color:#c7d2fe; color:#5e6edb; }
.resume-card .actions .mini:hover { border-color:#6872d9; color:#5e6edb; }
.resume-detail { margin-top:8px; padding:9px 11px; background:#fafbfe; border-radius:8px; font-size:11px; color:#5a667c; line-height:1.6; display:none; }
.resume-detail.show { display:block; }
.resume-detail .dd-h { font-weight:600; color:#5e6edb; margin-bottom:3px; }
.pipeline-bar { display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap; }
.pipeline-chip { padding:5px 9px; border-radius:12px; font-size:10px; cursor:pointer; border:1px solid transparent; }
.pipeline-chip.active { outline:2px solid #6872d9; outline-offset:1px; }
.log-entry { padding:4px 0; font-size:11px; border-bottom:1px solid #f8fafc; font-family:"Cascadia Code","Consolas",monospace; }
.log-ok { color:#00b96b; } .log-err { color:#f5222d; } .log-info { color:#6872d9; } .log-dim { color:#a6afbd; }
.log-link { color:#6872d9; cursor:pointer; font-weight:600; }
.log-link:hover { text-decoration:underline; }
.empty { text-align:center; padding:30px 16px; color:#a6afbd; font-size:12px; }
.loading { display:inline-block; width:14px; height:14px; border:2px solid #e3e7ee; border-top-color:#6872d9; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.filter-row { display:flex; gap:6px; margin-bottom:10px; }
.filter-row select { flex:1; padding:6px 9px; border:1px solid #e3e7ee; border-radius:8px; font-size:11px; outline:none; color:#36435b; font-family:inherit; }
.other-placeholder { min-height:360px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.other-placeholder .op-icon { width:56px; height:56px; border-radius:16px; background:#f0f3ff; color:#6872d9; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
.other-placeholder .op-icon svg { width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:1.8; }
.other-placeholder h2 { font-size:16px; font-weight:600; color:#35415a; margin-bottom:8px; }
.other-placeholder p { max-width:280px; font-size:13px; line-height:24px; color:#8d97a8; }
.other-placeholder .op-btn { margin-top:20px; border-radius:8px; background:#eef2ff; color:#4f65ce; padding:8px 16px; font-size:12px; border:none; cursor:pointer; }
</style>
</head>
<body>

<!-- 顶部深色栏 -->
<header class="ml-header">
  <div class="left">
    <div class="logo">猎</div>
    <div class="title">明猎 - AI 招聘助手</div>
  </div>
  <div class="right">
    <button title="固定侧边栏"><svg viewBox="0 0 24 24"><path d="M12 17v5" stroke-linecap="round"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 0-1-1H10a1 1 0 0 0-1 1z" stroke-linejoin="round"/></svg></button>
    <button title="关闭"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-linecap="round"/><path d="M15 9l-6 6M9 9l6 6" stroke-linecap="round"/></svg></button>
  </div>
</header>

<!-- 职位信息区 -->
<section class="job-section">
  <div class="left">
    <div class="logo">猎</div>
    <div>
      <div class="name">明猎 AI 助手</div>
      <div class="sub">已关联职位：
        <span class="job-select-wrap">
          <select id="selJobGlobal"><option value="">加载中...</option></select>
        </span>
        <span id="headerStatus" style="font-size:11px;margin-left:8px"></span>
      </div>
    </div>
  </div>
  <button class="clear-btn" id="btnClearChat" title="清空会话"><svg viewBox="0 0 24 24"><path d="M3 6h18" stroke-linecap="round"/><path d="M8 6V4h8v2" stroke-linecap="round"/><path d="M19 6l-1 14H6L5 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</section>

<!-- 标签栏 -->
<nav class="nav">
  <button class="tab active" data-panel="chat"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z" stroke-linejoin="round"/></svg>AI 助手</button>
  <button class="tab" data-panel="resumes"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke-linecap="round"/><path d="M23 21v-2a4 4 0 0 0-3-3.87" stroke-linecap="round"/><path d="M16 3.13a4 4 0 0 1 0 7.75" stroke-linecap="round"/></svg>候选人</button>
  <button class="tab" data-panel="pipeline"><svg viewBox="0 0 24 24"><path d="M3 3v18h18" stroke-linecap="round"/><path d="M7 14l4-4 3 3 5-6" stroke-linecap="round" stroke-linejoin="round"/></svg>管道</button>
  <button class="tab" data-panel="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke-linecap="round"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/></svg>设置</button>
</nav>

<!-- 内容滚动区 -->
<div class="content thin-scroll">

  <!-- AI 助手面板 -->
  <section class="panel active" id="panel-chat">
    <div id="chatMessages">
      <div class="welcome">
        <div class="emoji">👋</div>
        <h2>Hi，你好</h2>
        <p>我是明猎 AI 招聘助手，有什么可以帮你的？</p>
      </div>

      <div class="help">
        <div class="sec-head">
          <span class="sec-title">我可以帮你</span>
          <span class="sec-tag">快捷操作</span>
        </div>
        <div class="help-grid">
          <button class="quick-card" data-msg="帮我分析一下当前岗位的简历情况">
            <div class="qc-head"><span class="qc-icon pink"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-linejoin="round"/><path d="M14 2v6h6" stroke-linejoin="round"/><line x1="16" y1="13" x2="8" y2="13" stroke-linecap="round"/><line x1="16" y1="17" x2="8" y2="17" stroke-linecap="round"/></svg></span><span class="qc-title">简历分析</span></div>
            <p class="qc-desc">分析候选人与职位的匹配情况</p>
          </button>
          <button class="quick-card" data-msg="推荐几个适合这个岗位的候选人">
            <div class="qc-head"><span class="qc-icon blue"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke-linecap="round"/><line x1="20" y1="8" x2="14" y2="8" stroke-linecap="round"/><line x1="17" y1="5" x2="17" y2="11" stroke-linecap="round"/></svg></span><span class="qc-title">推荐候选人</span></div>
            <p class="qc-desc">从人才库中推荐最匹配的人选</p>
          </button>
          <button class="quick-card" data-msg="这个岗位的市场薪资水平是多少">
            <div class="qc-head"><span class="qc-icon yellow"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" stroke-linejoin="round"/><path d="M3 10h18" stroke-linecap="round"/><circle cx="12" cy="15" r="1.5"/><path d="M9 15h.01M15 15h.01" stroke-linecap="round"/></svg></span><span class="qc-title">薪资查询</span></div>
            <p class="qc-desc">查询岗位市场薪资行情</p>
          </button>
          <button class="quick-card" data-msg="帮我写一份招聘JD">
            <div class="qc-head"><span class="qc-icon green"><svg viewBox="0 0 24 24"><path d="M15 4V2M15 16v-2" stroke-linecap="round"/><path d="M8 9h2a3 3 0 0 1 0 6H8V9z" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 4l-3 8 3 8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="qc-title">生成 JD</span></div>
            <p class="qc-desc">根据需求生成职位描述</p>
          </button>
        </div>
      </div>

      <div class="feedback" id="feedback"></div>
    </div>
  </section>

    <!-- 候选人面板 -->
  <section class="panel" id="panel-resumes">
    <div class="panel-title">候选人列表</div>
    <div class="filter-row">
      <select id="selSort"><option value="score">按分数排序</option><option value="time">按最新排序</option></select>
      <select id="selFilter"><option value="">全部分数</option><option value="high">≥80 推荐</option><option value="mid">60-79 待定</option><option value="low">&lt;60 淘汰</option></select>
    </div>
    <div id="resumeList"><div class="empty">选择岗位后加载候选人</div></div>
  </section>

  <!-- 管道面板 -->
  <section class="panel" id="panel-pipeline">
    <div class="panel-title">管道管理</div>
    <div class="pipeline-bar" id="pipelineBar"></div>
    <div id="pipelineContent"><div class="empty">选择岗位查看管道</div></div>
  </section>

  <!-- 设置面板 -->
  <section class="panel" id="panel-settings">
    <div class="panel-title">设置</div>
    <div id="settingsStatus" style="margin-bottom:12px;padding:8px 12px;border-radius:8px;font-size:12px;display:none"></div>
    <div class="config-row">
      <label>Key</label>
      <input type="password" id="inputApiKey" placeholder="LLM API Key">
    </div>
    <div class="config-row">
      <label>服务器</label>
      <input type="text" id="inputServer" value="http://127.0.0.1:5000">
    </div>
    <div style="margin:10px 0 6px;font-size:11px;color:#929bae">直连 DeepSeek（填了则「提交评分」走直连流式，不依赖后端）</div>
    <div class="config-row">
      <label>DS Key</label>
      <input type="password" id="inputDsKey" placeholder="sk-...（DeepSeek API Key）">
    </div>
    <div class="config-row">
      <label>DS 模型</label>
      <input type="text" id="inputDsModel" value="deepseek-chat" placeholder="deepseek-chat">
    </div>
    <div class="btn-group"><button class="btn btn-primary btn-block" id="btnSaveSettings">保存</button></div>
    <div id="settingsMsg" style="margin-top:8px;font-size:12px"></div>
    <div style="margin-top:20px;padding-top:12px;border-top:1px solid #e8ebf1">
      <div class="panel-title" style="font-size:12px">知识库</div>
      <div id="knowledgeStats" style="font-size:11px;color:#929bae">加载中...</div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn btn-default btn-sm" id="btnRefreshKnowledge">刷新知识库</button>
        <button class="btn btn-default btn-sm" id="btnViewKnowledge">查看知识</button>
      </div>
      <div id="knowledgeList" style="margin-top:12px;max-height:300px;overflow-y:auto;font-size:12px"></div>
    </div>
  </section>

</div>

<!-- 底部 -->
<footer class="footer">
  <div id="collectBar" style="display:none;margin-bottom:8px;padding:8px 12px;border-radius:8px;background:#f0f7ff;color:#3d6fce;font-size:12px;align-items:center;justify-content:space-between">
    <span>已收集 <strong id="collectedCount">0</strong> 份简历</span>
    <span>
      <button id="btnSubmit" style="background:#534ab7;color:#fff;border:none;border-radius:4px;padding:3px 10px;font-size:11px;cursor:pointer">📤 提交评分</button>
      <button id="btnClearCollect" style="background:none;color:#999;border:1px solid #ddd;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;margin-left:4px">清空</button>
    </span>
  </div>
  <div class="chips thin-scroll">
    <button class="chip" data-msg="请总结这个职位的推荐理由"><svg viewBox="0 0 24 24"><path d="M3 3v18h18" stroke-linecap="round"/><path d="M7 14l4-4 3 3 5-6" stroke-linecap="round" stroke-linejoin="round"/></svg>推荐理由</button>
    <button class="chip" data-msg="请分析当前职位的人才风险"><svg viewBox="0 0 24 24"><path d="M12 9v4" stroke-linecap="round"/><path d="M12 17h.01" stroke-width="3" stroke-linecap="round"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke-linejoin="round"/></svg>风险点</button>
    <button class="chip" data-msg="请查询这个职位的薪资行情"><svg viewBox="0 0 24 24"><path d="M9 18h6" stroke-linecap="round"/><path d="M10 22h4" stroke-linecap="round"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z" stroke-linejoin="round"/></svg>薪资行情</button>
    <button class="chip" id="quickScrape"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z" stroke-linejoin="round"/></svg>一键抓取</button>
  </div>
  <div class="input-row">
    <textarea id="chatInput" placeholder="输入问题，如：推荐理由、人才风险点、薪资行情..." rows="1"></textarea>
    <button class="send-btn" id="btnSend"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="scrapeLog" style="max-height:80px;overflow-y:auto;margin-top:6px;font-size:11px;color:#888"></div>
  <div class="footer-hint">内容由 AI 生成，请仔细甄别</div>
</footer>

<script src="deepseek.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
