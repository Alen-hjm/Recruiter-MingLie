{% extends "base.html" %}
{% set active = "candidates" %}
{% block title %}候选人管理 - 明猎{% endblock %}

{% block content %}
<div class="topbar">
    <div class="topbar-left">
        <h1>候选人管理</h1>
        <p>查看评分结果，约面或淘汰候选人</p>
    </div>
    <div style="display:flex;gap:8px">
        <select id="job-select" class="form-input" style="width:200px" onchange="loadCandidates()">
            <option value="">选择岗位...</option>
        </select>
    </div>
</div>

<!-- 统计卡片 -->
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
    <div class="card" style="text-align:center;padding:16px">
        <div style="font-size:24px;font-weight:700;color:#10b981" id="count-recommended">0</div>
        <div style="font-size:12px;color:#666;margin-top:4px">🟢 推荐约面 (≥80)</div>
    </div>
    <div class="card" style="text-align:center;padding:16px">
        <div style="font-size:24px;font-weight:700;color:#f59e0b" id="count-pending">0</div>
        <div style="font-size:12px;color:#666;margin-top:4px">🟡 待定 (60-80)</div>
    </div>
    <div class="card" style="text-align:center;padding:16px">
        <div style="font-size:24px;font-weight:700;color:#6366f1" id="count-interviewed">0</div>
        <div style="font-size:12px;color:#666;margin-top:4px">📋 已约面</div>
    </div>
    <div class="card" style="text-align:center;padding:16px">
        <div style="font-size:24px;font-weight:700;color:#ef4444" id="count-rejected">0</div>
        <div style="font-size:12px;color:#666;margin-top:4px">🔴 已淘汰</div>
    </div>
</div>

<!-- Tab 切换 -->
<div style="display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #eee;padding-bottom:8px">
    <button class="btn btn-sm tab-btn active" data-tab="recommended" onclick="switchTab('recommended')">🟢 推荐约面</button>
    <button class="btn btn-sm tab-btn" data-tab="pending" onclick="switchTab('pending')">🟡 待定</button>
    <button class="btn btn-sm tab-btn" data-tab="interviewed" onclick="switchTab('interviewed')">📋 已约面</button>
    <button class="btn btn-sm tab-btn" data-tab="rejected" onclick="switchTab('rejected')">🔴 已淘汰</button>
</div>

<!-- 候选人列表 -->
<div id="candidates-container"></div>

<!-- 淘汰原因弹窗 -->
<div id="reject-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
    <div class="card" style="width:500px;max-width:90vw;padding:24px">
        <h3 style="margin:0 0 16px">输入淘汰原因</h3>
        <div style="margin-bottom:12px;color:#666" id="reject-candidate-info"></div>
        <textarea id="reject-reason" class="form-input" rows="4" placeholder="请输入淘汰原因..."></textarea>
        <label style="display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer;font-size:13px;color:#666">
            <input type="checkbox" id="sync-obsidian"> 同步到 Obsidian 知识库（下次评分会参考此原因）
        </label>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
            <button class="btn btn-default" onclick="closeRejectModal()">取消</button>
            <button class="btn btn-danger" onclick="confirmReject()">确认淘汰</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentJobId = null;
let currentTab = 'recommended';
let candidatesData = {};
let rejectCandidate = null;

// 加载岗位列表
async function loadJobs() {
    const resp = await api('/api/jobs');
    if (!resp.success) return;
    const select = document.getElementById('job-select');
    resp.data.forEach(job => {
        const opt = document.createElement('option');
        opt.value = job.id;
        opt.textContent = job.name;
        select.appendChild(opt);
    });
    // 自动选择第一个
    if (resp.data.length > 0) {
        select.value = resp.data[0].id;
        loadCandidates();
    }
}

// 加载候选人
async function loadCandidates() {
    const jobId = document.getElementById('job-select').value;
    if (!jobId) return;
    currentJobId = jobId;

    const resp = await api(`/api/candidates/${jobId}`);
    if (!resp.success) {
        toast('加载失败', 'error');
        return;
    }

    candidatesData = resp.data;
    updateCounts();
    renderTab();
}

// 更新统计
function updateCounts() {
    document.getElementById('count-recommended').textContent = candidatesData.recommended?.length || 0;
    document.getElementById('count-pending').textContent = candidatesData.pending?.length || 0;
    document.getElementById('count-interviewed').textContent = candidatesData.interviewed?.length || 0;
    document.getElementById('count-rejected').textContent = candidatesData.rejected?.length || 0;
}

// 切换 Tab
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    renderTab();
}

// 渲染当前 Tab
function renderTab() {
    const container = document.getElementById('candidates-container');
    const list = candidatesData[currentTab] || [];

    if (list.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center;padding:40px;color:#999">暂无候选人</div>`;
        return;
    }

    let html = '<div style="display:flex;flex-direction:column;gap:8px">';
    list.forEach((resume, idx) => {
        // 多种方式获取分数
        let score = 0;
        if (resume._score) {
            score = resume._score;
        } else if (resume.score100) {
            if (typeof resume.score100 === 'object') {
                score = resume.score100.total_score || resume.score100.score || 0;
            } else {
                score = resume.score100;
            }
        } else if (resume.analysis) {
            if (typeof resume.analysis === 'object') {
                score = resume.analysis.total_score || resume.analysis.score || 0;
                if (score < 10) score = score * 10; // 10分制转100分制
            } else {
                score = resume.analysis;
            }
        }
        score = Math.round(score);
        const scoreColor = score >= 80 ? '#10b981' : score >= 60 ? '#f59e0b' : '#ef4444';
        const feedback = resume._feedback;

        html += `
        <div class="card" style="padding:16px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div style="flex:1">
                    <div style="font-size:16px;font-weight:600">${resume.name || '未知'}</div>
                    <div style="color:#666;font-size:13px;margin-top:4px">${resume.title || ''} · ${resume.company || ''}</div>
                    <div style="color:#999;font-size:12px;margin-top:4px">
                        ${resume.experience || ''} · ${resume.education || ''} · ${resume.location || ''}
                        ${resume.salary ? ' · ' + resume.salary : ''}
                    </div>
                    ${resume.analysis?.summary ? `<div style="margin-top:8px;font-size:13px;color:#333">${resume.analysis.summary}</div>` : ''}
                    ${feedback ? `<div style="margin-top:8px;font-size:12px;padding:6px 10px;border-radius:6px;background:${feedback.feedback_type === 'interview' ? '#e6f9ee' : '#fff0f0'};color:${feedback.feedback_type === 'interview' ? '#1a8a4a' : '#c0392b'}">
                        ${feedback.feedback_type === 'interview' ? '✅ 已约面' : '❌ ' + feedback.reason}
                    </div>` : ''}
                </div>
                <div style="text-align:center;margin-left:16px">
                    <div style="font-size:28px;font-weight:700;color:${scoreColor}">${score}</div>
                    <div style="font-size:11px;color:#999">AI 评分</div>
                </div>
            </div>
            ${!feedback ? `
            <div style="display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #eee">
                <button class="btn btn-primary btn-sm" onclick="doAction('interview', ${idx})">✅ 约面</button>
                <button class="btn btn-danger btn-sm" onclick="openRejectModal(${idx})">❌ 淘汰</button>
                <div style="display:flex;gap:6px;margin-left:auto">
                    ${resume.organized_text ? `<button class="btn btn-default btn-sm" onclick="showOrganizedResume(${idx})">📋 AI整理简历</button>` : ''}
                    ${resume.detail_url ? `<a href="${resume.detail_url}" target="_blank" class="btn btn-default btn-sm">查看简历</a>` : ''}
                </div>
            </div>` : ''}
        </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
}

// 执行约面操作
async function doAction(action, idx) {
    const list = candidatesData[currentTab];
    const resume = list[idx];
    if (!resume) return;

    const resp = await api('/api/candidate/action', {
        method: 'POST',
        body: JSON.stringify({
            action: action,
            job_id: parseInt(currentJobId),
            candidate_name: resume.name || '',
            resume_key: resume._key || '',
            ai_score: resume._score || 0,
            reason: action === 'interview' ? '推荐约面' : '',
        }),
    });

    if (resp.success) {
        toast(action === 'interview' ? '已约面' : '已淘汰', 'success');
        loadCandidates(); // 刷新
    } else {
        toast(resp.error || '操作失败', 'error');
    }
}

// 打开淘汰弹窗
function openRejectModal(idx) {
    const list = candidatesData[currentTab];
    rejectCandidate = list[idx];
    if (!rejectCandidate) return;

    document.getElementById('reject-candidate-info').textContent =
        `候选人：${rejectCandidate.name || '未知'} · AI评分：${rejectCandidate._score || 0}分`;
    document.getElementById('reject-reason').value = '';
    document.getElementById('reject-modal').style.display = 'flex';
}

function closeRejectModal() {
    document.getElementById('reject-modal').style.display = 'none';
    rejectCandidate = null;
}

// 确认淘汰
async function confirmReject() {
    const reason = document.getElementById('reject-reason').value.trim();
    if (!reason) {
        toast('请输入淘汰原因', 'error');
        return;
    }

    const syncObsidian = document.getElementById('sync-obsidian').checked;

    const resp = await api('/api/candidate/action', {
        method: 'POST',
        body: JSON.stringify({
            action: 'reject',
            job_id: parseInt(currentJobId),
            candidate_name: rejectCandidate.name || '',
            resume_key: rejectCandidate._key || '',
            ai_score: rejectCandidate._score || 0,
            reason: reason,
            sync_to_obsidian: syncObsidian,
        }),
    });

    if (resp.success) {
        closeRejectModal();
        toast(syncObsidian ? '已淘汰，原因已同步到 Obsidian' : '已淘汰', 'success');
        loadCandidates();
    } else {
        toast(resp.error || '操作失败', 'error');
    }
}

// Tab 样式
const style = document.createElement('style');
style.textContent = `
.tab-btn { background:transparent; border:1px solid #ddd; color:#666; padding:6px 16px; border-radius:6px; cursor:pointer; font-size:13px; }
.tab-btn.active { background:var(--primary); color:white; border-color:var(--primary); }
.btn-danger { background:#ef4444; color:white; border:none; }
.btn-danger:hover { background:#dc2626; }
`;
document.head.appendChild(style);

loadJobs();

// 显示 AI 整理的简历
function showOrganizedResume(idx) {
    const list = candidatesData[currentTab];
    const resume = list[idx];
    if (!resume || !resume.organized_text) return;

    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

    const score = (resume.score100 || resume.analysis || {}).total_score || 0;
    const scoreColor = score >= 80 ? '#52c41a' : score >= 60 ? '#faad14' : '#ff4d4f';

    modal.innerHTML = `
        <div style="background:#fff;border-radius:12px;width:90%;max-width:700px;max-height:85vh;overflow:auto;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <h3 style="margin:0">📋 AI 整理的简历</h3>
                <button onclick="this.closest('div[style*=fixed]').remove()" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button>
            </div>
            <div style="display:flex;gap:12px;margin-bottom:16px;padding:12px;background:#f8f9fa;border-radius:8px">
                <div><strong>${resume.name || '未知'}</strong></div>
                <div style="color:#666">${resume.title || ''}</div>
                <div style="color:${scoreColor};font-weight:700;margin-left:auto">${score}分</div>
            </div>
            ${resume.detail_url ? `<div style="margin-bottom:12px"><a href="${resume.detail_url}" target="_blank" style="color:#4a6cf7;font-size:12px">🔗 查看原始简历</a></div>` : ''}
            <div style="white-space:pre-wrap;line-height:1.8;font-size:13px;color:#333;background:#fafafa;padding:16px;border-radius:8px;border:1px solid #eee">${resume.organized_text}</div>
        </div>
    `;
    document.body.appendChild(modal);
}
</script>
{% endblock %}
