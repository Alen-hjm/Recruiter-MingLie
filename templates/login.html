<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 明猎</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#e8f3ff 0%,#f0f2f5 50%,#e8f3ff 100%); }
.login-card { background:#fff; border-radius:16px; padding:40px; width:400px; box-shadow:0 8px 32px rgba(22,93,255,0.08); }
.login-logo { text-align:center; margin-bottom:32px; }
.login-logo .logo-icon { width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--primary-light)); display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:22px; font-weight:700; box-shadow:0 4px 16px rgba(22,93,255,0.3); margin-bottom:12px; }
.login-logo h2 { font-size:20px; color:var(--text-1); }
.login-logo p { font-size:13px; color:var(--text-3); margin-top:4px; }
.login-card .form-input { padding:10px 14px; font-size:14px; }
.login-card .btn-primary { width:100%; padding:11px; font-size:15px; margin-top:8px; }
.flash { background:var(--danger-bg); color:var(--danger); padding:10px 14px; border-radius:var(--radius); font-size:13px; margin-bottom:16px; text-align:center; }
.login-footer { text-align:center; margin-top:20px; font-size:13px; color:var(--text-3); }
.login-footer a { color:var(--primary); text-decoration:none; }
</style>
</head>
<body>
<div class="login-card">
    <div class="login-logo">
        <div class="logo-icon">猎</div>
        <h2>明猎</h2>
        <p>AI 智能招聘系统</p>
    </div>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}
    <form method="POST">
        <div class="form-group">
            <label class="form-label">用户名</label>
            <input type="text" name="username" class="form-input" placeholder="请输入用户名" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-input" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary">登 录</button>
    </form>
    <div class="login-footer">还没有账号？<a href="/register">注册</a></div>
</div>
</body>
</html>
